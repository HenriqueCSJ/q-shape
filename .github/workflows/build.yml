name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Verify exact source checkout
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Pin npm 10.8.2
      run: npm install --global npm@10.8.2

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        CI: true
        REACT_APP_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Verify embedded source identity
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: grep --recursive --include='*.js' --fixed-strings --quiet "$EXPECTED_SHA" build/static/js

    - name: Check build size
      run: |
        du -sh build/
        echo "Build completed successfully!"
